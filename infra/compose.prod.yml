services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - school-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      HANBIT_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HANBIT_BOOTSTRAP_ADMIN_ID: ${HANBIT_BOOTSTRAP_ADMIN_ID:-}
      HANBIT_BOOTSTRAP_ADMIN_PASSWORD: ${HANBIT_BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    depends_on:
      backend:
        condition: service_healthy
  tunnel:
    image: cloudflare/cloudflared:2026.5.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run", "--credentials-file", "/etc/cloudflared/credentials.json", "${HANBIT_TUNNEL_ID:?Set HANBIT_TUNNEL_ID}"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${HANBIT_TUNNEL_CREDENTIALS:?Set HANBIT_TUNNEL_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    depends_on:
      web:
        condition: service_started
volumes:
  school-data:
